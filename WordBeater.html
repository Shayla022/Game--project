<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #bd915b, #3b505f);
        color: white;
      }

      .container {
        text-align: center;
        width: 600px;
      }

      h1 {
        background: #ffffff22;
        padding: 15px;
        margin-bottom: 40px;
        font-size: 42px;
      }

      .small {
        font-size: 18px;
        margin-bottom: 15px;
      }

      #word {
        font-size: 70px;
        margin: 20px 0;
      }

      input {
        width: 70%;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        outline: none;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin: 25px 80px;
        font-size: 22px;
      }

      .box {
        margin-top: 40px;
        background: #ffffff22;
        padding: 25px;
        border-radius: 10px;
      }

      .box h3 {
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Word Shmasher</h1>

      <div class="small">Type The Given Word Within <b>5</b> Seconds:</div>

      <div id="word">mango</div>

      <input id="input" placeholder="Start typing..." autofocus />

      <div id="message"></div>

      <div class="row">
        <div>Time Left: <span id="time">6</span></div>
        <div>Score: <span id="score">0</span></div>
      </div>

      <div class="box">
        <h3>Instructions</h3>
        <p>
          Type each word in the given amount of seconds to score. To play again,
          just type the current word. Your score will reset.
        </p>
      </div>
    </div>
  </body>

  <script src="main.js"></script>
</html>
