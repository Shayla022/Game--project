<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        background: #c9b8c1;
        padding-top: 100px;
      }

      .playerBox {
        display: inline-block;
        margin: 20px;
        padding: 20px;
        background: white;
        border-radius: 15px;
      }

      button {
        padding: 8px 15px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background: #46363e;
        color: white;
        cursor: pointer;
      }

      .winner {
        background: #945b60;
        color: white;
      }
    </style>
  </head>
  <body>
    <h2>Dice Game</h2>

    <div class="playerBox">
      Player 1 Score: <span id="player1">0</span> <br /><br />
      <button onclick="roll(1)">Roll</button>
    </div>

    <div class="playerBox">
      Player 2 Score: <span id="player2">0</span> <br /><br />
      <button onclick="roll(2)">Roll</button>
    </div>

    <p id="result">Roll the dice</p>

    <button onclick="reset()">Reset</button>
  </body>

  <script>
    let player1 = 0;
    let player2 = 0;
    let limit = 20;

    function roll(player) {
      let dice = Math.floor(Math.random() * 6) + 1;
      // document.getElementById("result").innerText = "Dice: " + dice;

      if (player === 1) {
        player1 += dice;
        document.getElementById("player1").innerText = player1;

        if (player1 >= limit) {
          document.getElementById("result").innerText = "Player 1 Wins!";
          disableButtons();
        }
      } else {
        player2 += dice;
        document.getElementById("player2").innerText = player2;

        if (player2 >= limit) {
          document.getElementById("result").innerText = "Player 2 Wins!";
          disableButtons();
        }
      }
    }

    function reset() {
      player1 = 0;
      player2 = 0;

      document.getElementById("player1").innerText = 0;
      document.getElementById("player2").innerText = 0;
      document.getElementById("result").innerText = "Roll the dice";

      document
        .querySelectorAll("button")
        .forEach((btn) => (btn.disabled = false));
    }
  </script>
</html>
